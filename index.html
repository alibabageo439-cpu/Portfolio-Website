  <!-- Home Section -->
  <section class="hero" id="home">
    <div class="hero-left">
      <h1>
        <span class="intro">I Am</span><br>
        <span id="typed-text"></span><span class="cursor">|</span>

  <div class="contact-wrapper">
    <!-- Contact Section -->
    <section class="section contact" id="contact">
      <h2>Contact Me</h2>

      <form action="https://formspree.io/f/xgvqyeon" method="POST">
        <input type="text" name="name" placeholder="Your Name" required>

        <input type="email" name="email" placeholder="Enter your Own Email" required>

        <button type="submit">Send Message</button>
      </form>
    </section>

    </footer>

  <script>
    const texts = [
      "Full-Stack Developer",
      "Software Engineer",
      "Web & Mobile app Developer",
      "Node.js Expert",
      "Android App Developer",
      "Backend Developer",
      "Platform Architect",
      "I can create the best website & APP for your needs"
    ];

    let currentText = 0;
    let charIndex = 0;
    const typedText = document.getElementById("typed-text");

    function type() {
      if (charIndex < texts[currentText].length) {
        typedText.textContent += texts[currentText].charAt(charIndex);
        charIndex++;
        setTimeout(type, 90);
      } else {
        setTimeout(deleteText, 1500);
      }
    }

    function deleteText() {
      if (charIndex > 0) {
        typedText.textContent = texts[currentText].substring(0, charIndex - 1);
        charIndex--;
        setTimeout(deleteText, 50);
      } else {
        currentText = (currentText + 1) % texts.length;
        setTimeout(type, 90);
      }
    }

    type();
  </script>
